<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Khadidja 💙</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #5b5fc7, #1a103f, #05010f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Floating stars */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(1.5px 1.5px at 70% 40%, white, transparent),
        radial-gradient(1px 1px at 40% 80%, white, transparent),
        radial-gradient(2px 2px at 80% 70%, white, transparent),
        radial-gradient(1px 1px at 10% 60%, white, transparent);
      opacity: 0.8;
      animation: floatStars 20s linear infinite alternate;
      z-index: -1;
    }

    @keyframes floatStars {
      from { transform: translateY(0); }
      to { transform: translateY(-25px); }
    }

    .page {
      position: absolute;
      max-width: 900px;
      padding: 30px;
      opacity: 0;
      transform: translateY(35px);
      pointer-events: none;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .page.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    h1, h2, p {
      animation: textFade 1.3s ease forwards;
    }

    @keyframes textFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart { color: #ff4f8b; }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 35px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .yes {
      background: #ff4f8b;
      color: white;
    }

    .no {
      background: #444;
      color: white;
      position: relative;
    }

    button:hover {
      transform: scale(1.12);
      box-shadow: 0 0 25px rgba(255,100,180,0.6);
    }

    img {
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      margin: 15px;
    }

    .image-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .gifts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 22px;
      margin-top: 30px;
    }

    .gift {
      background: rgba(255,255,255,0.12);
      padding: 22px;
      border-radius: 22px;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.4s ease;
    }

    .gift:hover {
      background: rgba(255,255,255,0.28);
      transform: scale(1.08);
    }

    .spotify {
      margin-top: 25px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .letter {
      text-align: left;
      line-height: 1.7;
      background: rgba(0,0,0,0.45);
      padding: 30px;
      border-radius: 22px;
    }

    .poem {
      margin-top: 28px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <h1>Hey Khadidja <span class="heart">❤️</span></h1>
  <h2>I have a very important question for you..</h2>
  <p>You are saying yes I don’t care :D</p>

  <button class="yes" onclick="goTo('page2')">YES</button>
  <button class="no" onmouseover="moveNo(this)">NO</button>
</div>
